[project]
name = "qatar-data-checks"
version = "0.1.0"
description = "Declarative data quality checks for pandas, with format checks for Qatar IDs, phone numbers, QAR amounts and Arabic text"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohaned Elhagar" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "scipy>=1.10",
    "hijridate>=2.3",
]

[project.optional-dependencies]
parquet = ["pyarrow>=12"]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=7", "pyarrow>=12"]

[project.scripts]
qdc = "qatar_data_checks.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
